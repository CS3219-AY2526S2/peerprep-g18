version: '3.8'

services:
  # The Front Door (Public)
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - collab-service
    restart: always

  # The Bouncer (Internal)
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    expose:
      - "1234"
    volumes:
      - ./api-gateway:/app
    depends_on:
      - user-service
    environment:
      - PYTHONUNBUFFERED=1

  # The Librarian (Internal)
  user-service:
    build: ./user-service
    container_name: user-service
    expose:
      - "6767"
    volumes:
      - ./user-service:/app
    env_file:
      - ./user-service/.env # Contains SMTP_EMAIL and SMTP_PASSWORD
    environment:
      - PYTHONUNBUFFERED=1

  collab-service:
      build: ./collaboration-service
      container_name: collab-service
      expose:
        - "4000"
      volumes:
        - ./collaboration-service:/app
        - /app/node_modules  # <--- CRITICAL: Protects the installed packages
  
  matching-service:
    build: ./matching-service
    container_name: matching-service
    expose:
      - "8000"
    ports:
      - "8000:8000" # For debugging, TO REMOVE
    volumes:
      - ./matching-service:/app
    depends_on:
      - redis
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
  
  redis:
    image: redis:7-alpine
    container_name: redis
    expose:
      - "6379"
    ports:
      - "6379:6379" # For debugging, TO REMOVE
