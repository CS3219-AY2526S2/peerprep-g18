version: '3.8'

services:
  # The Front Door (Public)
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - collab-service
    restart: always

  # The Bouncer (Internal)
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    expose:
      - "1234"
    volumes:
      - ./api-gateway:/app
    depends_on:
      - user-service
      - redis-event-bus # Listen for match events
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_EVENT_BUS_HOST=redis-event-bus

  # ==========
  # The (Internal) Services
  # ==========
  user-service:
    build: ./user-service
    container_name: user-service
    expose:
      - "6767"
    volumes:
      - ./user-service:/app
    env_file:
      - ./user-service/.env # Contains SMTP_EMAIL and SMTP_PASSWORD
    environment:
      - PYTHONUNBUFFERED=1

  collab-service:
    build: ./collaboration-service
    container_name: collab-service
    expose:
      - "4000"
    volumes:
      - ./collaboration-service:/app
      - /app/node_modules

  question-service:
    build: ./question-service
    container_name: question-service
    expose:
      - "6768"
    volumes:
      - ./question-service:/app
    environment:
      - PYTHONUNBUFFERED=1

  matching-service:
    build: ./matching-service
    container_name: matching-service
    expose:
      - "6769"
    volumes:
      - ./matching-service:/app
    depends_on:
      - redis-matching    # User queue
      - redis-event-bus   # To publish event
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_MATCH_HOST=redis-matching
      - REDIS_EVENT_BUS_HOST=redis-event-bus
  
  redis-matching:
    image: redis:7-alpine
    container_name: redis-matching
    expose:
      - "6379"
  
  # Event bus for communication between API gateway/Matching service
  redis-event-bus:
    image: redis:7-alpine
    container_name: redis-event-bus
    expose:
      - "6379"
