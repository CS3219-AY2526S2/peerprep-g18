events {
    worker_connections 1024;
}

# Inside nginx.conf
http {
    resolver 127.0.0.11 valid=30s; # Docker's internal DNS

    # Allow large JWT tokens in headers
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Load balancer for collab-service replicas
    # ip_hash ensures sticky sessions — a client always hits the same instance
    upstream collab_upstream {
        ip_hash;
        server collab-service:4000;
    }

    server {
        listen 80;

        location /socket.io/ {
            proxy_pass http://collab_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

    location /api/ {
        # Forward to Gateway
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api-gateway:1234;

        # --- CRITICAL FIXES ---
        proxy_http_version 1.1;           # Use 1.1 instead of default 1.0
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Host $host;
        
        # Explicitly pass the Auth header (Nginx usually does this, 
        # but being explicit prevents some "strip-header" behaviors)
        proxy_set_header Authorization $http_authorization; 
        proxy_pass_header Authorization;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    }
}