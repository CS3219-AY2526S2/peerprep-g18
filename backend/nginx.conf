events { 
    worker_connections 1024; 
}

# Inside nginx.conf
http {
    resolver 127.0.0.11 valid=30s; # Docker's internal DNS

    server {
        listen 80;

        location /socket.io/ {
            set $upstream_collab collab-service; # Store name in variable
            proxy_pass http://$upstream_collab:4000;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /api/ {
            # 1. Standard CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-User-Id' always;

            # 2. Handle Preflight (OPTIONS)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-User-Id';
                return 204;
            }

            # 3. Forward to Gateway
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api-gateway:1234;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}