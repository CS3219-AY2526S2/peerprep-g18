name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  backend-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, user-service, question-service, matching-service, history-service, ai-service]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/${{ matrix.service }}/requirements.txt ]; then
            pip install -r backend/${{ matrix.service }}/requirements.txt
          fi
          pip install ruff pytest "httpx==0.27.2" pytest-asyncio
      - name: Create dummy Firebase credentials
        run: |
          # Create dummy firebase-service-account.json if it doesn't exist
          # This prevents crashes during module import in tests
          DUMMY_JSON='{"type": "service_account", "project_id": "dummy", "private_key": "dummy", "client_email": "dummy"}'
          echo $DUMMY_JSON > backend/${{ matrix.service }}/firebase-service-account.json
          echo $DUMMY_JSON > backend/${{ matrix.service }}/firebase-questionservice.json
          echo $DUMMY_JSON > backend/${{ matrix.service }}/firebase-historyservice.json
      - name: Lint with ruff
        run: |
          # stop the build if there are Python syntax errors or undefined names
          ruff check backend/${{ matrix.service }} --select=E9,F63,F7,F82
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          ruff check backend/${{ matrix.service }} --exit-zero --statistics
      - name: Run tests (if they exist)
        run: |
          # Only run pytest if there are files starting with test_
          if ls backend/${{ matrix.service }}/**/test_*.py >/dev/null 2>&1 || ls backend/${{ matrix.service }}/test_*.py >/dev/null 2>&1; then
            pytest backend/${{ matrix.service }}
          else
            echo "No tests found for ${{ matrix.service }}."
          fi

  backend-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: backend/collaboration-service/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: backend/collaboration-service

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: api-gateway, path: backend/api-gateway }
          - { name: user-service, path: backend/user-service }
          - { name: question-service, path: backend/question-service }
          - { name: matching-service, path: backend/matching-service }
          - { name: history-service, path: backend/history-service }
          - { name: ai-service, path: backend/ai-service }
          - { name: collaboration-service, path: backend/collaboration-service }
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build ${{ matrix.service.path }} -t ${{ matrix.service.name }}:latest

  docker-compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          # Create dummy .env files if they don't exist to satisfy docker-compose
          touch backend/user-service/.env
          touch backend/ai-service/.env
          docker compose -f backend/docker-compose.yml config
