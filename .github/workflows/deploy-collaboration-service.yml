name: Deploy Collaboration Service

on:
  push:
    branches: [ main, deployment ]
    paths: [ 'backend/collaboration-service/**' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/peerprep/collaboration-service:$IMAGE_TAG ./backend/collaboration-service
          docker push $ECR_REGISTRY/peerprep/collaboration-service:$IMAGE_TAG

      - name: Download Task Definition
        run: |
          aws ecs describe-task-definition --task-definition collaboration-service --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: collaboration-service
          image: ${{ steps.login-ecr.outputs.registry }}/peerprep/collaboration-service:${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: collaboration-service
          cluster: peerprep-cluster
          wait-for-service-stability: true